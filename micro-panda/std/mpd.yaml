name: std
version: 0.1.0

targets:
  std:
    entry: main
    src: src/
    type: bin
    flags: [HOSTED]
    output: bin/std
    test: test/
    cc:
      bin: gcc
      flags: [-O2, -Wall, -Isrc]

  test:
    entry: main
    src: src/
    type: bin
    flags: [HOSTED]
    output: bin/test
    test: test/
    cc:
      bin: gcc
      flags: [-O2, -Wall, -Isrc]