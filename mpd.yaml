name: my_project
version: 0.1.0

src: src/    # micro-panda source root
out: out/    # generated C files (default)

# Platform definitions — referenced by targets via `platform:`.
# Each platform sets default properties (e.g. entry_fn) for all targets that use it.
# platforms:
#   esp32:
#     entry_fn: app_main
#   rp2040:
#     entry_fn: main

targets:
  # Simple mode: mpd drives compilation directly
  main:
    entry: main
    platform: linux-x64
    cc: gcc
    cflags: [-O2, -Wall]
    flags: [release]
    output: bin/app

  debug:
    entry: main
    platform: linux-x64
    cc: gcc
    cflags: [-g, -O0]
    flags: [debug]
    output: bin/app_debug

  # Custom mode: mpd generates C, external build system compiles
  # esp_firmware:
  #   entry: main
  #   platform: esp32
  #   out: components/app/        # place generated C where IDF expects it
  #   build_cmd: idf.py build
  #   flags: [mcu32]

  # Multi-toolchain example
  # arm_firmware:
  #   entry: firmware/main
  #   platform: arm-cortex-m4
  #   cc: arm-none-eabi-gcc
  #   cc_path: /opt/arm-toolchain/bin
  #   cflags: [-mcpu=cortex-m4, -Os, -ffreestanding]
  #   flags: [release]
  #   output: bin/firmware.elf
